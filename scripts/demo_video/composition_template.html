<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>투두리스트 기능 전반 시연</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgun.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgunbd.ttf") format("truetype"); font-weight: 700; }
      :root { --navy: #0b1730; --blue: #2563eb; --green: #22c55e; --amber: #f59e0b; --red: #ef4444; --ink: #0f172a; }
      body { margin: 0; background: var(--navy); font-family: "Malgun", sans-serif; color: #fff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(1200px 700px at 70% 20%, #1d3b75 0%, var(--navy) 60%); }
      .clip { position: absolute; inset: 0; }
      .center { position: absolute; inset: 0 0 90px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

      .badge { font-size: 30px; font-weight: 700; color: #bfdbfe; border: 2px solid #3b82f6; border-radius: 999px;
        padding: 10px 28px; background: rgba(37, 99, 235, 0.18); }
      .title { margin-top: 36px; font-size: 100px; font-weight: 700; letter-spacing: -2px; line-height: 1.2; }
      .title em, .closing em { font-style: normal; color: #60a5fa; }
      .subtitle { margin-top: 30px; font-size: 38px; color: #cbd5e1; }
      .flow { margin-top: 56px; display: flex; gap: 22px; }
      .flow span { font-size: 34px; font-weight: 700; padding: 14px 26px; border-radius: 14px;
        background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(147, 197, 253, 0.5); }

      .pile-head { position: absolute; left: 160px; top: 170px; width: 760px; }
      .pile-head h2 { margin: 0; font-size: 66px; line-height: 1.3; }
      .pile-head p { margin: 24px 0 0; font-size: 34px; color: #cbd5e1; }
      .count { margin-top: 40px; font-size: 120px; font-weight: 700; color: #93c5fd; }
      .count span + span { font-size: 40px; color: #cbd5e1; margin-left: 12px; }
      .pile { position: absolute; left: 1040px; top: 90px; width: 720px; height: 820px; }
      .note { position: absolute; left: 0; width: 720px; height: 104px; box-sizing: border-box; padding: 18px 26px;
        border-radius: 18px; background: #fff; color: var(--ink); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35); }
      .note b { display: block; font-size: 26px; color: #475569; }
      .note div { margin-top: 6px; font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .note.key { border: 4px solid var(--red); }
      .missed { position: absolute; left: 1430px; top: 300px; white-space: nowrap; font-size: 36px; font-weight: 700;
        color: #fff; background: var(--red); padding: 12px 24px; border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.4); }

      .frame { position: absolute; left: {{FL}}px; top: {{FT}}px; width: {{FW}}px; height: {{FH}}px; border-radius: 14px;
        overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); background: #fff; }
      .zoom { position: absolute; left: 0; top: 0; width: {{FW}}px; height: {{FH}}px; transform-origin: 0 0; }
      .zoom img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .hl { position: absolute; border: 5px solid var(--amber); border-radius: 10px; box-sizing: border-box; opacity: 0; }
      .dim { position: absolute; inset: 0; background: rgba(11, 23, 48, 0.72); }
      .pop { position: absolute; border-radius: 10px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); overflow: hidden; }
      .pop img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .pop .hl { opacity: 0; }
      .step { position: absolute; font-size: 36px; font-weight: 700; padding: 14px 28px; border-radius: 14px; color: #fff;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); white-space: nowrap; }
      .step.blue { background: var(--blue); } .step.green { background: #16a34a; }
      .step.amber { background: #d97706; } .step.red { background: #dc2626; }
      .footnote { position: absolute; right: 30px; top: 2px; font-size: 22px; color: #94a3b8; }

      .chips { display: flex; gap: 28px; }
      .chip { font-size: 40px; font-weight: 700; padding: 20px 36px; border-radius: 16px; background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(34, 197, 94, 0.7); color: #e2e8f0; }
      .chip i { font-style: normal; color: var(--green); margin-right: 14px; }
      .sec-note { margin-top: 40px; font-size: 30px; color: #94a3b8; }
      .crop { position: relative; margin-top: 44px; width: 760px; height: 170px; overflow: hidden; border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
      .crop img { position: absolute; width: 3204px; left: -2440px; top: -60px; }
      .limit-box { width: 1300px; padding: 46px 60px; border-radius: 22px; background: rgba(245, 158, 11, 0.12);
        border: 3px solid rgba(245, 158, 11, 0.7); text-align: left; }
      .limit-h { font-size: 44px; font-weight: 700; color: #fcd34d; }
      .limit-b { margin-top: 22px; font-size: 38px; line-height: 1.6; color: #f1f5f9; }
      .closing { font-size: 96px; font-weight: 700; letter-spacing: -2px; line-height: 1.25; }
      .product { margin-top: 36px; font-size: 36px; color: #94a3b8; }

      .cap { position: absolute; left: 0; right: 0; bottom: 22px; top: auto; display: flex; justify-content: center; align-items: flex-end; }
      .cap span { max-width: 1700px; font-size: 40px; font-weight: 700; line-height: 1.35; text-align: center; padding: 12px 30px;
        border-radius: 12px; background: rgba(2, 6, 23, 0.82); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{TOTAL}}">
{{SECTIONS}}
{{CAPTIONS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
{{SCRIPT}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
